
<header class="site-header">

    <div class="header-top">
        <div class="header-top-inner">

            <!-- Logotipo -->
            <a class="brand" href="{% url 'pagina_principal' %}" aria-label="Majestanimais - página inicial">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <circle cx="7" cy="7" r="2"/>
                        <circle cx="12" cy="4.5" r="2"/>
                        <circle cx="17" cy="7" r="2"/>
                        <circle cx="19" cy="12" r="1.7"/>
                        <path d="M12 11c-3.2 0-6.5 3.1-6.5 6.1A3 3 0 0 0 8.6 20c1.3 0 2.3-.8 3.4-.8s2.1.8 3.4.8a3 3 0 0 0 3.1-2.9c0-3-3.3-6.1-6.5-6.1Z"/>
                    </svg>
                </span>
                <span>majestanimais</span>
            </a>

            <!-- Notificações, configurações e usuário -->
            <div class="header-actions">

                <a
                    href="{% url 'notificacoes' %}"
                    class="header-icon"
                    aria-label="Notificações"
                    title="Notificações"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
                        <path d="M10 21h4"/>
                    </svg>
                    <span class="notification-dot"></span>
                </a>

                <a
                    href="{% url 'perfil_usuario' %}"
                    class="user-avatar"
                    aria-label="Meu perfil"
                    title="Meu perfil"
                >
                    U
                </a>

            </div>
        </div>
    </div>

</header>
